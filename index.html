<!doctype html>
<html lang="">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yes论坛</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #090909;
      }

      #app {
        min-height: 100vh;
      }

      /* 首屏加载：在 Vue 挂载前显示，避免冷启动白屏 */
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background:
          radial-gradient(900px 520px at 18% -10%, rgba(109, 74, 158, 0.16), transparent 65%),
          radial-gradient(800px 480px at 82% -10%, rgba(212, 166, 58, 0.08), transparent 65%),
          #090909;
        opacity: 1;
        animation: splash-in 0.24s ease-out 0.12s backwards;
        transition: opacity 0.22s ease;
      }

      #app-splash.is-hidden {
        animation: none;
        opacity: 0;
        pointer-events: none;
      }

      .splash-brand {
        color: #405a6f;
        font:
          600 24px/1.2 system-ui,
          -apple-system,
          'Segoe UI',
          'Microsoft YaHei',
          sans-serif;
        text-shadow: 0 0 18px rgba(64, 90, 111, 0.55);
      }

      .splash-bar {
        width: 160px;
        height: 2px;
        overflow: hidden;
        border-radius: 2px;
        background: #2a2a2a;
      }

      .splash-bar::after {
        display: block;
        width: 45%;
        height: 100%;
        content: '';
        background: linear-gradient(90deg, transparent, #d4a63a, transparent);
        animation: splash-flow 1.1s ease-in-out infinite;
      }

      .splash-sr {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @keyframes splash-in {
        from {
          opacity: 0;
        }

        to {
          opacity: 1;
        }
      }

      @keyframes splash-flow {
        from {
          transform: translateX(-120%);
        }

        to {
          transform: translateX(320%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #app-splash {
          animation: none;
          transition: none;
        }

        .splash-bar::after {
          animation: none;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="app-splash" role="status" aria-live="polite">
      <span class="splash-brand">Yes论坛</span>
      <span class="splash-bar" aria-hidden="true"></span>
      <span class="splash-sr">页面加载中</span>
    </div>
    <script type="module" src="/src/main.ts"></script>
    <!-- Live2D 看板娘：全局引入，来源 https://github.com/stevenjoezhang/live2d-widget
         初始化见 public/live2d.js；加载失败不影响应用本身。
         样式改为非阻塞加载，避免外部 CDN 拖慢首屏。 -->
    <link
      rel="preload"
      as="style"
      href="https://gcore.jsdelivr.net/npm/live2d-widgets@1.0.1/dist/waifu.css"
      onload="
        this.onload = null
        this.rel = 'stylesheet'
      "
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://gcore.jsdelivr.net/npm/live2d-widgets@1.0.1/dist/waifu.css"
      />
    </noscript>
    <script src="/live2d.js" defer></script>
  </body>
</html>
